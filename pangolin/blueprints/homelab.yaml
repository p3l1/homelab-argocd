---
# Welche Dienste durch den Pangolin-Tunnel erreichbar sind.
#
# Die Ziele zeigen auf die ExternalName-Dienste aus apps/newt/config/services,
# die Newt im Cluster aufloest. So steht hier je Anwendung ein Name,
# unabhaengig davon, in welchem Namensraum sie laeuft.
#
# Angewendet von der Tekton-Pipeline in pangolin/tekton, nicht von ArgoCD.
public-resources:
  argocd:
    name: ArgoCD
    protocol: http
    full-domain: argocd.p3l1.de
    auth:
      sso-enabled: true
    targets:
      - site: homelab
        hostname: newt-argocd-service.newt.svc.cluster.local
        method: https
        port: 443

  paperless:
    name: Paperless
    protocol: http
    full-domain: paperless.p3l1.de
    auth:
      sso-enabled: true
    targets:
      - site: homelab
        hostname: newt-paperless-service.newt.svc.cluster.local
        method: http
        port: 8000

  umami:
    name: Umami
    protocol: http
    full-domain: umami.p3l1.de
    auth:
      # Umami sammelt Zugriffe fremder Seiten ein; das Skript muss ohne
      # Anmeldung erreichbar sein.
      sso-enabled: false
    targets:
      - site: homelab
        hostname: newt-umami-service.newt.svc.cluster.local
        method: http
        port: 3000

  arcane:
    name: Arcane
    protocol: http
    full-domain: arcane.p3l1.de
    auth:
      sso-enabled: true
    targets:
      - site: homelab
        hostname: newt-arcane-service.newt.svc.cluster.local
        method: http
        port: 3552
