---
# Welche Dienste des k3s-Clusters durch den Tunnel erreichbar sind.
#
# site verweist auf "Homelab Services" - die Site, an der der Newt aus
# apps/newt haengt. Die uebrigen Sites (Homelab Documents, Homelab
# Monitoring) gehören zu anderen Hosts und werden hier nicht angefasst.
#
# Die Ziele zeigen auf die ExternalName-Dienste aus apps/newt/config/services,
# die Newt im Cluster aufloest. So steht hier je Anwendung ein Name,
# unabhaengig davon, in welchem Namensraum sie laeuft.
#
# Angewendet von der Tekton-Pipeline in pangolin/tekton, nicht von ArgoCD.
# Nur über einen Pangolin-Client erreichbar, nicht aus dem Netz. Der
# Machine Client "homelab-argocd CI" nutzt den Alias, um aus GitHub Actions
# die Blueprint-Pipeline anzustossen.
private-resources:
  tekton-webhook:
    name: Tekton Webhook
    mode: host
    destination: el-pangolin-blueprints.tekton-pipelines.svc.cluster.local
    site: intent-anniella-pulchra
    tcp-ports: "8080"
    # Nicht tekton.homelab.internal - der Name gehört der Traefik-Route im
    # LAN; zwei Ziele unter einem Namen wären nur verwirrend.
    alias: tekton-webhook.homelab.internal
    # Zugriff nur für den CI-Client. Keine Rollen und keine Benutzer:
    # Admins haben ohnehin Zugriff, und der interne und der Pocket-ID-Benutzer
    # teilen sich Benutzername und Adresse - der Blueprint loest über genau
    # diese Felder auf und traefe daher immer beide.
    #
    # Die Liste gehört in den Blueprint, nicht nur in die API: jeder Lauf
    # löscht die bestehenden Zuordnungen und setzt sie aus dieser Datei neu.
    machines:
      # niceId des Clients "homelab-argocd CI"
      - fine-mastigoproctus-giganteus

  mcp-documents:
    name: Paperless MCP
    # Private HTTP wie bei Paperless: echter Name mit gueltigem Zertifikat,
    # aber nur mit aktivem Pangolin-Client erreichbar, nie aus dem Netz. Der
    # MCP-Server traegt einen Token mit vollem Zugriff und hat keine Anmeldung.
    mode: http
    full-domain: mcp-documents.cloud.p3l1.de
    ssl: true
    site: intent-anniella-pulchra
    # scheme/destination-port beschreiben den Weg zum Ziel, nicht den zum
    # Client - der laeuft über ssl.
    scheme: http
    destination: newt-paperless-mcp-service.newt.svc.cluster.local
    destination-port: 3000
    # Ohne machines-Liste haben nur Admins Zugriff. Soll ein bestimmter
    # Client heran, gehört dessen niceId hierher - und zwar in diese
    # Datei, denn jeder Lauf setzt die Zuordnungen daraus neu.

  home-assistant:
    name: Home Assistant
    # Privat wie Paperless MCP: echter Name mit gueltigem Zertifikat, aber
    # nur mit aktivem Pangolin-Client erreichbar. Kein vorgeschaltetes SSO -
    # Home Assistant meldet selbst an, über Pocket ID via auth_oidc, und
    # die Companion-App wie auch die Webhooks kaemen an einer zweiten
    # Anmeldeseite nicht vorbei.
    mode: http
    full-domain: home.cloud.p3l1.de
    ssl: true
    site: intent-anniella-pulchra
    scheme: http
    destination: newt-home-assistant-service.newt.svc.cluster.local
    destination-port: 8123

public-resources:
  # Leer, und das ist Absicht: pangolin-gateway veröffentlicht diese Dienste
  # jetzt aus HTTPRoutes, die bei ihren Anwendungen liegen — je eine Datei
  # httproute-pangolin.yaml neben der bestehenden Route für Traefik. Die
  # Ressourcen heißen in Pangolin gw-<namensraum>-<routenname>; der Controller
  # fasst ausschließlich dieses Präfix an.
  #
  # Die alten Einträge mussten von Hand aus Pangolin gelöscht werden, denn
  # dieser Blueprint löscht nichts. full-domain ist instanzweit eindeutig: ein
  # Konflikt hätte jeden Apply des Controllers scheitern lassen, und zwar für
  # alle Routen, nicht nur für die betroffene.
  {}
