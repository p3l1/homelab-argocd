---
# Welche Dienste des k3s-Clusters durch den Tunnel erreichbar sind.
#
# site verweist auf "Homelab Services" - die Site, an der der Newt aus
# apps/newt haengt. Die uebrigen Sites (Homelab Documents, Homelab
# Monitoring) gehoeren zu anderen Hosts und werden hier nicht angefasst.
#
# Die Ziele zeigen auf die ExternalName-Dienste aus apps/newt/config/services,
# die Newt im Cluster aufloest. So steht hier je Anwendung ein Name,
# unabhaengig davon, in welchem Namensraum sie laeuft.
#
# Angewendet von der Tekton-Pipeline in pangolin/tekton, nicht von ArgoCD.
# Nur ueber einen Pangolin-Client erreichbar, nicht aus dem Netz. Der
# Machine Client "homelab-argocd CI" nutzt den Alias, um aus GitHub Actions
# die Blueprint-Pipeline anzustossen.
private-resources:
  tekton-webhook:
    name: Tekton Webhook
    mode: host
    destination: el-pangolin-blueprints.tekton-pipelines.svc.cluster.local
    site: intent-anniella-pulchra
    tcp-ports: "8080"
    # Nicht tekton.homelab.internal - der Name gehoert der Traefik-Route im
    # LAN; zwei Ziele unter einem Namen waeren nur verwirrend.
    alias: tekton-webhook.homelab.internal
    # Zugriff nur fuer den CI-Client. Keine Rollen und keine Benutzer:
    # Admins haben ohnehin Zugriff, und der interne und der Pocket-ID-Benutzer
    # teilen sich Benutzername und Adresse - der Blueprint loest ueber genau
    # diese Felder auf und traefe daher immer beide.
    #
    # Die Liste gehoert in den Blueprint, nicht nur in die API: jeder Lauf
    # loescht die bestehenden Zuordnungen und setzt sie aus dieser Datei neu.
    machines:
      # niceId des Clients "homelab-argocd CI"
      - fine-mastigoproctus-giganteus

  mcp-documents:
    name: Paperless MCP
    mode: host
    destination: newt-paperless-mcp-service.newt.svc.cluster.local
    site: intent-anniella-pulchra
    tcp-ports: "3000"
    # Der MCP-Server traegt einen API-Token mit vollem Zugriff auf alle 789
    # Dokumente und hat selbst keine Anmeldung. Deshalb privat: nur ueber
    # einen Pangolin-Client erreichbar, nie aus dem Netz.
    alias: mcp-documents.homelab.internal
    # Ohne machines-Liste haben nur Admins Zugriff. Soll ein bestimmter
    # Client heran, gehoert dessen niceId hierher - und zwar in diese
    # Datei, denn jeder Lauf setzt die Zuordnungen daraus neu.

public-resources:
  argocd:
    name: ArgoCD
    protocol: http
    full-domain: argocd.cloud.p3l1.de
    auth:
      sso-enabled: true
    targets:
      - site: intent-anniella-pulchra
        # argocd-server laeuft mit server.insecure=true, beide Dienstports
        # zeigen auf 8080 und sprechen HTTP. Mit https gab es Bad Gateway.
        method: http
        hostname: newt-argocd-service.newt.svc.cluster.local
        port: 80
        healthcheck:
          hostname: newt-argocd-service.newt.svc.cluster.local
          port: 80
          path: /healthz
          interval: 30
          timeout: 5

  umami:
    name: Umami
    protocol: http
    full-domain: umami.cloud.p3l1.de
    auth:
      # Umami sammelt Zugriffe fremder Seiten ein; das Skript muss ohne
      # Anmeldung erreichbar sein.
      sso-enabled: false
    targets:
      - site: intent-anniella-pulchra
        method: http
        hostname: newt-umami-service.newt.svc.cluster.local
        port: 3000
        healthcheck:
          hostname: newt-umami-service.newt.svc.cluster.local
          port: 3000
          path: /api/heartbeat
          interval: 30
          timeout: 5

  tekton:
    name: Tekton Dashboard
    protocol: http
    full-domain: tekton.cloud.p3l1.de
    auth:
      sso-enabled: true
    targets:
      - site: intent-anniella-pulchra
        method: http
        hostname: newt-tekton-service.newt.svc.cluster.local
        port: 9097
        healthcheck:
          hostname: newt-tekton-service.newt.svc.cluster.local
          port: 9097
          path: /
          interval: 30
          timeout: 5

  pac:
    name: Pipelines-as-Code
    protocol: http
    full-domain: pac.cloud.p3l1.de
    auth:
      # Muss ohne Anmeldung erreichbar sein: GitHub stellt die Events
      # unbeaufsichtigt zu. Der Controller prueft stattdessen die
      # HMAC-Signatur, mit der GitHub jeden Aufruf unterschreibt.
      sso-enabled: false
    targets:
      - site: intent-anniella-pulchra
        method: http
        hostname: newt-pac-service.newt.svc.cluster.local
        port: 8080
        healthcheck:
          hostname: newt-pac-service.newt.svc.cluster.local
          port: 8080
          path: /
          interval: 30
          timeout: 5

  arcane:
    name: Arcane
    protocol: http
    full-domain: arcane.cloud.p3l1.de
    auth:
      sso-enabled: true
    targets:
      - site: intent-anniella-pulchra
        method: http
        hostname: newt-arcane-service.newt.svc.cluster.local
        port: 3552
        healthcheck:
          hostname: newt-arcane-service.newt.svc.cluster.local
          port: 3552
          path: /
          interval: 30
          timeout: 5

# Von Pipelines-as-Code ausgeloest - Aenderung an dieser Datei startet die Pipeline.

# Testlauf nach Installation der GitHub App.

# Erneuter Testlauf.
