---
# Die private-resource aus pangolin/blueprints/homelab.yaml, nicht die
# oeffentliche Route arcane.cloud.p3l1.de: die liegt hinter Pangolins SSO,
# bei dem sich ein Agent nicht anmelden kann.
arcane_agent_manager_url: http://arcane-manager.homelab.internal:3552

# Namensauflösung fuer den Alias, als Name-zu-Adresse-Abbildung. Der Host
# loest ihn nicht selbst auf, weil pangolin_client seinen Resolver bewusst
# nicht umbiegt. Adresse zeigt "pangolin list aliases".
arcane_agent_extra_hosts: {}

# Token des Environments. Der Manager erzeugt es beim Anlegen des
# Environments; die Rolle bricht ohne Wert ab. Quelle ist
# inventory/group_vars/<gruppe>/secrets.sops.yml.
arcane_agent_token: ""

# Auf die Fassung des Managers gepinnt, siehe
# apps/arcane/config/deployment.yaml.
arcane_agent_version: v2.10.2
arcane_agent_image: "ghcr.io/getarcaneapp/agent:{{ arcane_agent_version }}"

arcane_agent_dir: /opt/arcane
arcane_agent_name: arcane-edge-agent

# poll haelt keinen Tunnel offen. auto braucht im Reverse Proxy einen
# h2c-Router auf /api/tunnel/connect und einen Read-Timeout von 0s.
arcane_agent_transport: poll

arcane_agent_timezone: Europe/Berlin

# Prueft nach dem Start, ob der Manager das Token annimmt.
arcane_agent_verify: true

# Wartezeit bis zum ersten Poll des Agenten, in Sekunden.
arcane_agent_verify_delay: 20
