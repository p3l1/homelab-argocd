---
- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Reload console setup
  ansible.builtin.systemd:
    name: console-setup
    state: restarted

# Die Overlays greifen erst nach einem Neustart.
- name: Reboot node
  ansible.builtin.reboot:
    reboot_timeout: 300
