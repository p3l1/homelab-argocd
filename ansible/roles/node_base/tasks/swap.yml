---
# Kubernetes verlangt abgeschalteten Swap.
#
# Auf Raspberry Pi OS Trixie gibt es kein dphys-swapfile mehr - den Swap legt
# systemd-zram-generator als /dev/zram0 an, konfiguriert in
# /usr/lib/systemd/zram-generator.conf. Eine Datei in /etc hat Vorrang.
- name: Check for systemd-zram-generator
  ansible.builtin.stat:
    path: /usr/lib/systemd/zram-generator.conf
  register: node_base_zram_conf

- name: Disable zram swap
  when: node_base_zram_conf.stat.exists
  block:
    - name: Override the zram configuration
      ansible.builtin.copy:
        content: |
          # Von Ansible verwaltet - Rolle node_base, swap.yml
          # Kubernetes verlangt abgeschalteten Swap.
          [zram0]
          zram-size = 0
        dest: /etc/systemd/zram-generator.conf
        owner: root
        group: root
        mode: "0644"

    # Sicherheitsnetz: greift die Konfiguration nicht, verhindert die
    # Maskierung den Start trotzdem.
    - name: Mask the zram setup unit
      ansible.builtin.systemd:
        name: systemd-zram-setup@zram0.service
        enabled: false
        masked: true
      failed_when: false

# dphys-swapfile gibt es auf aelteren Ausgaben noch.
- name: Check for dphys-swapfile
  ansible.builtin.stat:
    path: /etc/init.d/dphys-swapfile
  register: node_base_dphys

- name: Disable dphys-swapfile
  when: node_base_dphys.stat.exists
  ansible.builtin.systemd:
    name: dphys-swapfile
    state: stopped
    enabled: false
    masked: true

# /proc/swaps statt swapon, das liegt in /sbin und damit ausserhalb des
# PATH einer nicht angemeldeten Sitzung.
- name: Read active swap devices
  ansible.builtin.command: cat /proc/swaps
  register: node_base_swaps
  changed_when: false

- name: Disable remaining swap
  ansible.builtin.command: /sbin/swapoff -a
  when: node_base_swaps.stdout_lines | length > 1
  changed_when: true

- name: Remove swap entries from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#].*\sswap\s'
    state: absent
