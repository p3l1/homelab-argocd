---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Ensure hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ node_timezone }}"

- name: Install packages
  ansible.builtin.apt:
    name: "{{ node_base_packages + (node_bluetooth | bool | ternary(['bluez', 'rfkill'], [])) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable iscsid for Longhorn
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true

- name: Configure node
  ansible.builtin.include_tasks: "{{ include_item }}"
  loop:
    - swap.yml
    - network.yml
    - ssh.yml
    - cleanup.yml
    - led.yml
  loop_control:
    loop_var: include_item

- name: Set up Bluetooth where it is wanted
  when: node_bluetooth | bool
  block:
    - name: Enable bluetooth
      ansible.builtin.systemd:
        name: bluetooth
        state: started
        enabled: true

    - name: Install the unit that unblocks the radios
      ansible.builtin.copy:
        src: bluetooth-unblock.service
        dest: /etc/systemd/system/bluetooth-unblock.service
        mode: "0644"

    - name: Enable unblocking at boot
      ansible.builtin.systemd:
        name: bluetooth-unblock
        state: started
        enabled: true
        daemon_reload: true

    - name: Confirm every adapter is unblocked
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rfkill --output TYPE,SOFT --noheadings | awk '$1 == "bluetooth" && $2 != "unblocked"'
        executable: /bin/bash
      register: node_bluetooth_blocked
      changed_when: false
      failed_when: node_bluetooth_blocked.stdout | length > 0

- name: Allow sudo via forwarded SSH agent
  ansible.builtin.include_tasks: sudo_agent.yml
  when: node_sudo_via_ssh_agent | bool

# Ganz zum Schluss: die apt-Laeufe weiter oben setzen /etc/default/locale
# ueber update-locale auf den Stand des Abbilds zurueck.
- name: Set locale and keymap
  ansible.builtin.include_tasks: locale.yml
