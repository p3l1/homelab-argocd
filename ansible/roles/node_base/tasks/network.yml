---
# Raspberry Pi OS nutzt seit Bookworm NetworkManager.
#
# Das Anlegen des Profils aktiviert es sofort - die Adresse wechselt also
# mitten im Lauf und die SSH-Verbindung bricht weg. Deshalb wird der Task als
# unerreichbar geduldet, danach auf die Zieladresse umgeschaltet und dort
# gewartet. Stimmt die Adresse schon, passiert nichts und der Lauf bleibt
# idempotent.
- name: Configure static address profile
  community.general.nmcli:
    conn_name: "{{ node_network_conn_name }}"
    ifname: "{{ node_network_interface }}"
    type: ethernet
    method4: manual
    ip4: "{{ node_address }}/{{ node_network_prefix }}"
    gw4: "{{ node_network_gateway }}"
    dns4: "{{ node_network_dns }}"
    method6: disabled
    autoconnect: true
    state: present
  ignore_unreachable: true
  register: node_base_nmcli

- name: Follow the node to its address
  ansible.builtin.set_fact:
    ansible_host: "{{ node_address }}"

- name: Wait for the node to answer there
  ansible.builtin.wait_for_connection:
    delay: 5
    sleep: 5
    timeout: 180

- name: Confirm the address is in place
  ansible.builtin.command: nmcli -t -f NAME con show --active
  register: node_base_active_conn
  changed_when: false

- name: Fail if the profile did not take
  ansible.builtin.assert:
    that: node_network_conn_name in node_base_active_conn.stdout_lines
    fail_msg: >-
      Das Profil {{ node_network_conn_name }} ist nicht aktiv.
      Aktiv sind: {{ node_base_active_conn.stdout_lines | join(', ') }}

# Erst entfernen, wenn die feste Adresse steht - sonst faellt der Node
# zurueck ins Nichts.
- name: Remove the DHCP profile created at first boot
  community.general.nmcli:
    conn_name: "Wired connection 1"
    state: absent
