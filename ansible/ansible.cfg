[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
collections_path = ./.collections
interpreter_python = auto_silent
host_key_checking = False
stdout_callback = default
result_format = yaml
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
pipelining = True
# ForwardAgent wird fuer sudo per pam_ssh_agent_auth gebraucht.
# ControlMaster haelt die Verbindung offen, sonst verlangt der YubiKey
# bei jeder Aufgabe erneut eine Bestaetigung.
# ServerAlive* deckt den Adresswechsel in node_base ab: die alte Verbindung
# stirbt lautlos, ohne diese Pruefung wartet ssh unbegrenzt weiter.
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=4

# Die nix-Binaries haben unter macOS keine Freigabe fuers lokale Netz und
# scheitern mit "No route to host". Apples Fassung ist davon ausgenommen.
ssh_executable = /usr/bin/ssh
sftp_executable = /usr/bin/sftp
scp_executable = /usr/bin/scp
