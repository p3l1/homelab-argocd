---
# Diese Hosts sind keine Cluster-Nodes: Anmeldung als root, kein sudo.
# Muss hierher und nicht in die Inventory-Datei - group_vars/all steht in
# Ansibles Rangfolge ueber den Gruppenvariablen einer Inventory-Datei,
# ueber dieser Datei aber nicht.
ansible_user: root
ansible_become: false

# Kein IdentitiesOnly: der Schluessel liegt auch im SSH-Agent, der die
# Signatur verweigert - ssh faellt nur ohne diese Option auf die Datei
# zurueck.
ansible_ssh_private_key_file: ~/.ssh/docker_ed25519
