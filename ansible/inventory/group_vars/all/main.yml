---
# --- Zugang ---------------------------------------------------------------
ansible_user: pi
ansible_become: true

# Zieladresse des Node. Im regulaeren Inventory identisch mit der
# Verbindungsadresse; beim Bootstrap haengt der Node noch am DHCP und
# inventory/bootstrap.yml setzt beide getrennt.
node_address: "{{ ansible_host }}"
# Quelle ist ansible/files/ssh/ - flash-node.sh liest dieselben Dateien.
node_ssh_public_key_files:
  - files/ssh/yubikey.pub

# --- Netz -----------------------------------------------------------------
node_network_prefix: 24
node_network_gateway: 10.35.99.1
node_network_dns:
  - 10.35.99.1
  - 1.1.1.1
node_timezone: Europe/Berlin
node_locale: de_DE.UTF-8

# --- k3s ------------------------------------------------------------------
k3s_version: v1.36.4+k3s1
api_endpoint: 10.35.99.210      # kube-vip, siehe Rolle kube_vip
api_port: 6443
cluster_context: homelab
user_kubectl: true

# servicelb weicht MetalLB, local-storage weicht Longhorn.
#
# Der Cloud-Controller bleibt an: ohne ihn behalten alle Nodes den Taint
# node.cloudprovider.kubernetes.io/uninitialized und sind unschedulable.
# Fuer MetalLB genuegt es, servicelb abzuschalten.
#
# Der Taint haelt Workloads von der Control Plane fern; sie laufen auf den
# Agents. kube-vip toleriert ihn.
server_config_yaml: |
  disable:
    - servicelb
    - local-storage
    # Der mitgelieferte Traefik weicht der gepflegten Fassung aus
    # apps/traefik, die als Gateway-API-Controller laeuft.
    - traefik
  write-kubeconfig-mode: "0644"
  node-taint:
    - "CriticalAddonsOnly=true:NoExecute"

# --- kube-vip -------------------------------------------------------------
kube_vip_address: "{{ api_endpoint }}"
kube_vip_version: v1.2.3
kube_vip_interface: eth0

# --- NetworkManager -------------------------------------------------------
node_network_interface: eth0
node_network_conn_name: homelab-static
