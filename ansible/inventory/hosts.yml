---
# Adressplan siehe docs/superpowers/specs/2026-09-05-cluster-rebuild-design.md
# Ausgespart: .1 Gateway, .100 Talos-Node, .200 dessen Traefik-LoadBalancer.
k3s_cluster:
  children:
    server:
      hosts:
        kube-01:
          ansible_host: 10.35.99.211
          node_model: rpi4
        kube-02:
          ansible_host: 10.35.99.212
          node_model: rpi4
        kube-03:
          ansible_host: 10.35.99.213
          node_model: rpi4
    agent:
      hosts:
        kube-04:
          ansible_host: 10.35.99.214
          node_model: rpi4
        kube-05:
          ansible_host: 10.35.99.215
          node_model: rpi5
        kube-06:
          ansible_host: 10.35.99.216
          node_model: rpi5

# Noch von Docker belegt. Aufnehmen, indem die Hosts nach agent verschoben werden.
reserved:
  hosts:
    kube-07:
      ansible_host: 10.35.99.217
      node_model: rpi5
    kube-08:
      ansible_host: 10.35.99.218
      node_model: rpi5

# Die Collection delegiert das Abholen der kubeconfig auf den Steuerrechner.
# Ohne diesen Eintrag erbt er ansible_user und ansible_become aus
# group_vars/all und versucht auf dem Mac ein sudo als 'pi' - der Lauf
# bricht dann mit einem become-Timeout ab.
control_node:
  hosts:
    127.0.0.1:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
