apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: versatiles
  namespace: versatiles
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - tiles.homelab.internal
  rules:
    - backendRefs:
        - name: versatiles
          port: 8080
