# Ein kleines Sprachmodell fuer die Paperless-Vorschlaege, lokal statt in
# der Cloud. Laeuft auf einem Raspberry Pi 5, der dafuer freigeraeumt und
# mit dedicated=llm:NoSchedule abgeschirmt ist - ein 1B-Modell auf vier
# ARM-Kernen vertraegt keine Nachbarn.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: apps
  sources:
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/ollama/config
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
