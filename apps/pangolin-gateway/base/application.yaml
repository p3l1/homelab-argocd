# Veroeffentlicht HTTPRoutes als Pangolin-Ressourcen. Ersetzt damit schrittweise
# die handgeschriebenen public-resources aus pangolin/blueprints/homelab.yaml:
# jede Route, die auf die GatewayClass "pangolin" zeigt, legt der Controller
# selbst an - und raeumt sie weg, sobald die Route verschwindet.
#
# Der Controller fasst ausschliesslich Ressourcen mit dem Praefix "gw-" an. Die
# uebrigen Eintraege aus homelab.yaml bleiben unberuehrt, auch waehrend der
# Umstellung.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pangolin-gateway
  namespace: argocd
  annotations:
    # Nach Traefik, das die Gateway-API-CRDs mitbringt, und nach Newt, dessen
    # Tunnel die veroeffentlichten Ziele erreichbar macht.
    argocd.argoproj.io/sync-wave: "-4"
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: infrastructure
  sources:
    - chart: pangolin-gateway
      repoURL: ghcr.io/p3l1/charts
      targetRevision: 0.3.0
      helm:
        valuesObject:
          pangolin:
            # Integration-API einschliesslich Versionspfad - nicht die interne
            # API. Zeigt das hierher falsch, kommt jeder Aufruf als 401 zurueck
            # und sieht aus wie ein falscher Schluessel.
            endpoint: https://cloud.p3l1.de/v1
            org: cloud.p3l1.de
            # Site "Homelab Services", dieselbe, an der der Newt aus apps/newt
            # haengt. Routen koennen sie per Annotation ueberschreiben.
            defaultSite: intent-anniella-pulchra
            apiKeySecret:
              name: pangolin-gateway-credentials
              key: PANGOLIN_API_KEY
            # Der handgeschriebene Eintrag "regenalarm" wurde zuvor von Hand aus
            # Pangolin geloescht; er hielt regen.cloud.p3l1.de und haette jeden
            # Apply scheitern lassen. Zum Nachstellen eines Trockenlaufs wieder
            # auf true setzen.
            dryRun: false
          gatewayClass:
            create: true
            name: pangolin
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/pangolin-gateway/config
  destination:
    server: https://kubernetes.default.svc
    namespace: pangolin-gateway
