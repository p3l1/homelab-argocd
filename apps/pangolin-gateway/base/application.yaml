# Veröffentlicht HTTPRoutes als Pangolin-Ressourcen. Ersetzt damit schrittweise
# die handgeschriebenen public-resources aus pangolin/blueprints/homelab.yaml:
# jede Route, die auf die GatewayClass "pangolin" zeigt, legt der Controller
# selbst an - und räumt sie weg, sobald die Route verschwindet.
#
# Der Controller fasst ausschließlich Ressourcen mit dem Präfix "gw-" an. Die
# uebrigen Eintraege aus homelab.yaml bleiben unberührt, auch während der
# Umstellung.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pangolin-gateway
  namespace: argocd
  annotations:
    # Nach Traefik, das die Gateway-API-CRDs mitbringt, und nach Newt, dessen
    # Tunnel die veröffentlichten Ziele erreichbar macht.
    argocd.argoproj.io/sync-wave: "-4"
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: infrastructure
  sources:
    - chart: pangolin-gateway
      repoURL: ghcr.io/p3l1/charts
      targetRevision: 0.4.0
      helm:
        valuesObject:
          pangolin:
            # Integration-API einschliesslich Versionspfad - nicht die interne
            # API. Zeigt das hierher falsch, kommt jeder Aufruf als 401 zurück
            # und sieht aus wie ein falscher Schluessel.
            endpoint: https://cloud.p3l1.de/v1
            org: cloud.p3l1.de
            # Site "Homelab Services", dieselbe, an der der Newt aus apps/newt
            # haengt. Routen können sie per Annotation überschreiben.
            defaultSite: intent-anniella-pulchra
            apiKeySecret:
              name: pangolin-gateway-credentials
              key: PANGOLIN_API_KEY
            # Der handgeschriebene Eintrag "regenalarm" wurde zuvor von Hand aus
            # Pangolin gelöscht; er hielt regen.cloud.p3l1.de und hätte jeden
            # Apply scheitern lassen. Zum Nachstellen eines Trockenlaufs wieder
            # auf true setzen.
            dryRun: false
          gatewayClass:
            create: true
            name: pangolin
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/pangolin-gateway/config
  destination:
    server: https://kubernetes.default.svc
    namespace: pangolin-gateway
