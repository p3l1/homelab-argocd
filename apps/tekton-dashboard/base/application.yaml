# Oberflaeche fuer Tekton: Pipeline-Laeufe, Aufgaben und Protokolle im
# Browser. Die Manifeste kommen als Kustomize direkt aus dem Upstream-Repo,
# auf einen Tag festgelegt - der Chart existiert nicht als Helm-Paket.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-dashboard
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  project: apps
  sources:
    - repoURL: https://github.com/tektoncd/dashboard.git
      targetRevision: v0.72.0
      path: config
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/tekton-dashboard/config
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
