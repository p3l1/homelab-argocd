# Oberflaeche fuer Tekton: Pipeline-Laeufe, Aufgaben und Protokolle im
# Browser.
#
# Das Release-Manifest liegt hier im Repo statt als Verweis auf das
# Upstream-Repo: dessen config/ ist eine Bauvorlage fuer ko, das Image steht
# dort als ko://-Platzhalter und der Namensraum fehlt in der Kustomization.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-dashboard
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  project: apps
  source:
    repoURL: https://github.com/p3l1/homelab-argocd.git
    targetRevision: main
    path: apps/tekton-dashboard/config
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
