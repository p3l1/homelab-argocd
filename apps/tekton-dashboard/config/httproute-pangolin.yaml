# Veröffentlicht das Tekton-Dashboard nach außen, über pangolin-gateway
# statt über den handgeschriebenen Eintrag in pangolin/blueprints/homelab.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-pangolin
  namespace: tekton-pipelines
  annotations:
    pangolin.p3l1.de/display-name: Tekton Dashboard
    pangolin.p3l1.de/healthcheck-path: /
    pangolin.p3l1.de/healthcheck-interval: "30"
    pangolin.p3l1.de/healthcheck-timeout: "5"
spec:
  parentRefs:
    - name: pangolin
      namespace: pangolin-gateway
  hostnames:
    - tekton.cloud.p3l1.de
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097
