# Nimmt Webhooks entgegen und erzeugt daraus PipelineRuns. Der EventListener
# selbst liegt in pangolin/tekton - er gehoert zur Blueprint-Pipeline.
#
# Die Release-Manifeste liegen im Repo statt als Verweis auf das Upstream-Repo;
# dessen config/ ist eine Bauvorlage fuer ko und nicht einsetzbar.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-triggers
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Die CRDs sprengen bei client-side apply das 256-KiB-Limit der
      # last-applied-configuration-Annotation.
      - ServerSideApply=true
  project: apps
  source:
    repoURL: https://github.com/p3l1/homelab-argocd.git
    targetRevision: main
    path: apps/tekton-triggers/config
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
        - .spec.preserveUnknownFields
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
