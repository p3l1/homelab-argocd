# Dokumentenverwaltung. Datenbank ueber CloudNativePG, Valkey und die
# Office-Dienste als eigene Manifeste aus apps/paperless-ngx/config.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: apps
  sources:
    - chart: paperless
      repoURL: https://zekker6.github.io/helm-charts
      targetRevision: 11.8.0
      helm:
        valuesObject:
          image:
            tag: 3.1.3
          env:
            # Der externe Name ist der primaere: Aus PAPERLESS_URL bildet
            # Paperless die Links, die es verschickt, und die
            # OIDC-Rueckrufadresse. Der interne Name muss zusaetzlich
            # eingetragen sein, sonst weist Django POSTs ueber
            # paperless.homelab.internal als CSRF-Verstoss ab.
            PAPERLESS_URL: https://documents.cloud.p3l1.de
            PAPERLESS_CSRF_TRUSTED_ORIGINS: https://documents.cloud.p3l1.de,https://paperless.homelab.internal
            PAPERLESS_ALLOWED_HOSTS: documents.cloud.p3l1.de,paperless.homelab.internal
            PAPERLESS_TIME_ZONE: Europe/Berlin
            PAPERLESS_OCR_LANGUAGE: deu+eng
            PAPERLESS_OCR_LANGUAGES: deu eng
            # Ab v3 wird die Engine nicht mehr aus DBHOST abgeleitet; ohne
            # diese Zeile faellt Paperless auf SQLite zurueck.
            PAPERLESS_DBENGINE: postgresql
            PAPERLESS_DBHOST: paperless-db-rw
            PAPERLESS_DBNAME: paperless
            PAPERLESS_DBUSER:
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: username
            PAPERLESS_DBPASS:
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: password
            PAPERLESS_SECRET_KEY:
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SECRET_KEY
            PAPERLESS_REDIS: redis://valkey:6379
            PAPERLESS_TIKA_ENABLED: "1"
            PAPERLESS_TIKA_ENDPOINT: http://tika:9998
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
            # Nur Einbettungen, kein Generierungsmodell: Der Index braucht
            # laut paperless/config.py allein ai_enabled und ein
            # embedding_backend. Damit laufen Aehnlichkeitssuche und
            # semantische Suche vollstaendig lokal - kein Dokument verlaesst
            # den Cluster. Vorschlaege und Chat blieben aus, dafuer braeuchte
            # es zusaetzlich PAPERLESS_AI_LLM_BACKEND.
            PAPERLESS_AI_ENABLED: "true"
            # Ollama auf dem dafuer freigeraeumten Pi 5 (apps/ollama), nicht
            # bei einem Anbieter: Vertraege und Abrechnungen verlassen den
            # Cluster nicht. Gemessen rund 7 Token/s - genug fuer
            # Vorschlaege, spuerbar beim Chat.
            PAPERLESS_AI_LLM_BACKEND: ollama
            PAPERLESS_AI_LLM_ENDPOINT: http://ollama.ollama.svc.cluster.local:11434
            # gemma3:1b statt llama3.2:1b: gemessen viermal schneller
            # beim 270m-Geschwister und deutlich disziplinierter im Format
            # - llama plauderte um die Antwort herum und erfand Felder.
            PAPERLESS_AI_LLM_MODEL: gemma3:1b
            # "de", nicht "de-de" - entgegen der Intuition. Paperless
            # schlaegt den Code in Djangos LANGUAGES nach: "de-de" wird zu
            # "German", "de" bleibt stehen. Gemessen ist "de" aber besser:
            # bei "rewrite ... in German" faellt gemma3:1b in einen
            # Assistenzmodus ("Okay, I understand...") statt zu uebersetzen,
            # bei "in de" liefert es sauberes JSON. Dreimal je Variante.
            PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: de
            # Grosszuegig: Bei RAG kommt Kontext aehnlicher Dokumente dazu,
            # und das Modell rechnet auf vier ARM-Kernen ohne GPU.
            PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"
            # Der Aufbau des Vektorindex ueber 789 Dokumente sprengt das
            # voreingestellte Zeitlimit von 1800 s: Der Task wurde zweimal
            # hart abgebrochen. Die Dokumentation empfiehlt genau dafuer
            # eine hoehere Grenze auf schwacher Hardware.
            PAPERLESS_WORKER_TIMEOUT: "7200"
            PAPERLESS_AI_LLM_EMBEDDING_BACKEND: huggingface
            # Nicht das Standardmodell all-MiniLM-L6-v2: das ist auf
            # englische Archive ausgelegt, hier liegen deutsche Dokumente.
            PAPERLESS_AI_LLM_EMBEDDING_MODEL: intfloat/multilingual-e5-small
            # Eigener Client bei Pocket-ID, nicht der des Docker-Stacks:
            # so bleibt ein Secret-Wechsel auf eine Installation begrenzt.
            PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
            PAPERLESS_SOCIALACCOUNT_PROVIDERS:
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            PAPERLESS_EMAIL_HOST: ha01s025.org-dns.com
            PAPERLESS_EMAIL_PORT: "465"
            PAPERLESS_EMAIL_USE_SSL: "true"
            PAPERLESS_EMAIL_HOST_USER:
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_EMAIL_HOST_USER
            PAPERLESS_EMAIL_HOST_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_EMAIL_HOST_PASSWORD
          # Bislang ohne Grenze. Das Einbettungsmodell wird im Pod geladen
          # und gerechnet; ohne Limit koennte ein Indexlauf den Node fuellen,
          # auf dem auch die Datenbank liegt.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 3Gi
          service:
            main:
              ports:
                http:
                  port: 8000
          persistence:
            data:
              enabled: true
              size: 5Gi
              storageClass: longhorn
              accessMode: ReadWriteOnce
            media:
              enabled: true
              size: 20Gi
              storageClass: longhorn
              accessMode: ReadWriteOnce
            consume:
              enabled: true
              size: 5Gi
              storageClass: longhorn
              accessMode: ReadWriteOnce
            export:
              # 10 statt 5 GiB: Der Export ist rund 1 GB gross, entpackt
              # nochmal so viel.
              enabled: true
              size: 10Gi
              storageClass: longhorn
              accessMode: ReadWriteOnce
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/paperless-ngx/config
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
