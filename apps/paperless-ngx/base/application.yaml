# Dokumentenverwaltung. Datenbank ueber CloudNativePG, Valkey und die
# Office-Dienste als eigene Manifeste aus apps/paperless-ngx/config.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: apps
  sources:
    - chart: paperless
      repoURL: https://zekker6.github.io/helm-charts
      targetRevision: 11.8.0
      helm:
        valuesObject:
          image:
            tag: 3.1.3
          env:
            # Der externe Name ist der primaere: Aus PAPERLESS_URL bildet
            # Paperless die Links, die es verschickt, und die
            # OIDC-Rueckrufadresse. Der interne Name muss zusaetzlich
            # eingetragen sein, sonst weist Django POSTs ueber
            # paperless.homelab.internal als CSRF-Verstoss ab.
            PAPERLESS_URL: https://documents.cloud.p3l1.de
            PAPERLESS_CSRF_TRUSTED_ORIGINS: https://documents.cloud.p3l1.de,https://paperless.homelab.internal
            PAPERLESS_ALLOWED_HOSTS: documents.cloud.p3l1.de,paperless.homelab.internal
            PAPERLESS_TIME_ZONE: Europe/Berlin
            PAPERLESS_OCR_LANGUAGE: deu+eng
            PAPERLESS_OCR_LANGUAGES: deu eng
            # Ab v3 wird die Engine nicht mehr aus DBHOST abgeleitet; ohne
            # diese Zeile faellt Paperless auf SQLite zurueck.
            PAPERLESS_DBENGINE: postgresql
            PAPERLESS_DBHOST: paperless-db-rw
            PAPERLESS_DBNAME: paperless
            PAPERLESS_DBUSER:
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: username
            PAPERLESS_DBPASS:
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: password
            PAPERLESS_SECRET_KEY:
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SECRET_KEY
            PAPERLESS_REDIS: redis://valkey:6379
            PAPERLESS_TIKA_ENABLED: "1"
            PAPERLESS_TIKA_ENDPOINT: http://tika:9998
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
            # Eigener Client bei Pocket-ID, nicht der des Docker-Stacks:
            # so bleibt ein Secret-Wechsel auf eine Installation begrenzt.
            PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
            PAPERLESS_SOCIALACCOUNT_PROVIDERS:
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            # Der Import bringt acht aktive Mail-Regeln mit, drei davon
            # loeschen die Mail nach der Verarbeitung. Solange der
            # Docker-Stack dieselben Postfaecher abruft, darf hier nichts
            # laufen.
            PAPERLESS_EMAIL_TASK_CRON: disable
            PAPERLESS_EMAIL_HOST: ha01s025.org-dns.com
            PAPERLESS_EMAIL_PORT: "465"
            PAPERLESS_EMAIL_USE_SSL: "true"
            PAPERLESS_EMAIL_HOST_USER:
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_EMAIL_HOST_USER
            PAPERLESS_EMAIL_HOST_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_EMAIL_HOST_PASSWORD
          service:
            main:
              ports:
                http:
                  port: 8000
          persistence:
            data:
              enabled: true
              size: 5Gi
              storageClass: longhorn
              accessMode: ReadWriteOnce
            media:
              enabled: true
              size: 20Gi
              storageClass: longhorn
              accessMode: ReadWriteOnce
            consume:
              enabled: true
              size: 5Gi
              storageClass: longhorn
              accessMode: ReadWriteOnce
            export:
              # 10 statt 5 GiB: Der Export ist rund 1 GB gross, entpackt
              # nochmal so viel.
              enabled: true
              size: 10Gi
              storageClass: longhorn
              accessMode: ReadWriteOnce
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/paperless-ngx/config
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
