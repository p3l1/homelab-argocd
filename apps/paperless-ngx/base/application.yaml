# Dokumentenverwaltung. Datenbank ueber CloudNativePG, Redis bringt das
# Chart selbst mit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: apps
  sources:
    - chart: paperless-ngx
      repoURL: https://charts.gabe565.com
      targetRevision: 0.24.1
      helm:
        valuesObject:
          image:
            # Das Chart liefert nur 2.14.7 mit; diese Fassung entspricht der
            # Compose-Installation in p3l1/documents.
            tag: 2.20.14
          postgresql:
            enabled: false
          persistence:
            # Alle vier Volumes brauchen accessMode, sonst bricht das Chart
            # beim Rendern ab - export und consume sind per Vorgabe aktiv.
            data:
              enabled: true
              accessMode: ReadWriteOnce
              storageClass: longhorn
              size: 5Gi
            media:
              enabled: true
              accessMode: ReadWriteOnce
              storageClass: longhorn
              size: 20Gi
            consume:
              enabled: true
              accessMode: ReadWriteOnce
              storageClass: longhorn
              size: 5Gi
            export:
              enabled: true
              accessMode: ReadWriteOnce
              storageClass: longhorn
              size: 5Gi
          env:
            PAPERLESS_DBHOST: paperless-db-rw
            PAPERLESS_DBNAME: paperless
            PAPERLESS_DBUSER:
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: username
            PAPERLESS_DBPASS:
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: password
            PAPERLESS_TIME_ZONE: Europe/Berlin
            PAPERLESS_OCR_LANGUAGE: deu+eng
            # Office-Dokumente ueber Tika und Gotenberg, wie in der
            # Compose-Installation. Beide laufen als eigene Deployments
            # aus apps/paperless-ngx/config.
            PAPERLESS_TIKA_ENABLED: "1"
            PAPERLESS_TIKA_ENDPOINT: http://tika:9998
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/paperless-ngx/config
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
