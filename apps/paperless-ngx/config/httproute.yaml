---
# Erreichbar unter https://paperless.homelab.internal. Den DNS-Eintrag legt
# external-dns im Router an, das Zertifikat kommt vom Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless-ngx
  namespace: paperless
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - paperless.homelab.internal
  rules:
    - backendRefs:
        - name: paperless-ngx
          port: 8000
