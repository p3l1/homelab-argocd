# Tika und Gotenberg erschliessen Office-Dokumente. Das Chart kennt beide
# nicht, deshalb hier als eigene Deployments - analog zur Compose-Installation
# in p3l1/documents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
    spec:
      containers:
        - name: tika
          # 3.3.1.0 statt latest: gepinnt und mit arm64-Manifest.
          image: docker.io/apache/tika:3.3.1.0
          ports:
            - containerPort: 9998
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  namespace: paperless
spec:
  selector:
    app: tika
  ports:
    - port: 9998
      targetPort: http
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      containers:
        - name: gotenberg
          image: docker.io/gotenberg/gotenberg:8.31
          # Chromium wandelt .eml-Dateien um. Ohne diese Flags wuerde dabei
          # externer Inhalt geladen - Zaehlpixel, im Zweifel JavaScript.
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: paperless
spec:
  selector:
    app: gotenberg
  ports:
    - port: 3000
      targetPort: http
      name: http
---
# Das Chart bringt Bitnami-Redis mit, dessen versionierte Tags nicht mehr
# oeffentlich sind. Stattdessen Valkey - der quelloffene Fork nach dem
# Lizenzwechsel von Redis, protokollkompatibel, also bleibt redis:// gueltig.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
              name: valkey
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valkey-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
  namespace: paperless
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: paperless
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: valkey
      name: valkey
