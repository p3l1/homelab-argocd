- id: '1777935936967'
  alias: Licht im Flur einschalten
  description: 'Bewegungsmelder schaltet Flurlicht ein mit intelligenter Helligkeit:
    Tagsüber 100%, nach Sonnenuntergang 50%, nachts 10%

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_1_bewegung
    to: 'on'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: time
        after: '22:00:00'
        before: 07:00:00
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.flur
        data:
          brightness_pct: 10
    - conditions:
      - condition: sun
        after: sunset
      - condition: time
        before: '22:00:00'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.flur
        data:
          brightness_pct: 50
    default:
    - action: light.turn_on
      target:
        entity_id: light.flur
      data:
        brightness_pct: 100
  - delay:
      minutes: 1
  - action: light.turn_off
    target:
      entity_id: light.flur
    data: {}
  mode: single
