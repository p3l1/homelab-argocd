- id: waschmaschine_fertig_ansage
  alias: 'Waschmaschine: Fertig-Ansage und Erinnerung starten'
  description: Spielt TTS-Ansage wenn Waschmaschinen-Timer abläuft und startet Erinnerungsschleife
  mode: single
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.waschmaschine
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.waschmaschine_abgeholt
  - action: tts.speak
    target:
      entity_id: tts.google_ubersetzer_en_com_google_translate_en_com
    data:
      media_player_entity_id: media_player.sonos
      message: Die Wäsche ist fertig. Bitte entnehmen.
      language: de
  - action: notify.notify
    data:
      title: Waschmaschine fertig
      message: Die Wäsche ist fertig. Bitte entnehmen.
  - action: timer.start
    target:
      entity_id: timer.waschmaschine_erinnerung
- id: waschmaschine_erinnerung_wiederholen
  alias: 'Waschmaschine: Erinnerung wiederholen bis quittiert'
  description: Wiederholt TTS-Erinnerung alle 10 Minuten solange Wäsche nicht entnommen
    wurde
  mode: single
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.waschmaschine_erinnerung
  conditions:
  - condition: state
    entity_id: input_boolean.waschmaschine_abgeholt
    state: 'off'
  actions:
  - action: tts.speak
    target:
      entity_id: tts.google_ubersetzer_en_com_google_translate_en_com
    data:
      media_player_entity_id: media_player.sonos
      message: Die Wäsche wartet noch. Bitte entnehmen.
      language: de
  - action: notify.notify
    data:
      title: Wäsche wartet
      message: Die Wäsche wartet noch. Bitte entnehmen.
  - action: timer.start
    target:
      entity_id: timer.waschmaschine_erinnerung
- id: waschmaschine_licht_erinnerung
  alias: 'Waschmaschine: Licht blinken nach 30 Minuten'
  description: Lässt Sofa-Licht grün blinken wenn Wäsche nach 30 Minuten nicht entnommen
    wurde
  mode: single
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.waschmaschine
  actions:
  - delay: 00:30:00
  - condition: state
    entity_id: input_boolean.waschmaschine_abgeholt
    state: 'off'
  - action: script.turn_on
    target:
      entity_id: script.waschmaschine_licht_blinken
