- id: '1777946400007'
  alias: 'Licht: Kino-Modus beim TV einschalten'
  description: 'Schaltet Sofa- und Küchenlichter aus und dimmt alle anderen eingeschalteten
    Lichter auf 10%, sobald der Fernseher eingeschaltet wird.

    '
  triggers:
  - trigger: state
    entity_id: media_player.fernseher
    from: 'off'
  conditions: []
  mode: single
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.sofa_mitte
      - light.sofa_oben
      - light.sofa_unten
      - light.kuche_links
      - light.kuche_rechts
      - light.deckenlampe_bett
      - light.deckenlampe_schreibtisch
  - if:
    - condition: state
      entity_id: light.schreibtischlampe
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.schreibtischlampe
      data:
        brightness_pct: 10
  - if:
    - condition: state
      entity_id: light.bettlampe
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.bettlampe
      data:
        brightness_pct: 10
  - if:
    - condition: state
      entity_id: light.flur
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.flur
      data:
        brightness_pct: 10
- id: '1778123456789'
  alias: 'Morgenroutine: KI-Briefing mit Kalender, Wetter und Müll'
  description: '8:30 Uhr morgens: Abrufen von Terminen, Wettervorhersage und Müllkalender,
    dann mit Claude ein kurzes Briefing generieren und über Sonos abspielen.

    '
  triggers:
  - trigger: time
    at: 08:30:00
  conditions: []
  actions:
  - variables:
      calendar_allgemein: '{{ state_attr(''calendar.allgemein'', ''message'') | default(''Keine'',
        true) }}'
      calendar_uni: '{{ state_attr(''calendar.uni'', ''message'') | default(''Keine'',
        true) }}'
      calendar_ksj: '{{ state_attr(''calendar.ksj'', ''message'') | default(''Keine'',
        true) }}'
      weather_info: '{{ states(''weather.forecast_home'') }}, {{ state_attr(''weather.forecast_home'',
        ''temperature'') | float(0) }}°C'
      trash_info: '{{ state_attr(''calendar.abfallplaner'', ''message'') | default(''Keine'',
        true) }}'
      current_date: '{{ now().strftime(''%A, %-d. %B'') }}'
      current_hour: '{{ now().hour }}'
      top_3_todos: '{{ states(''sensor.top_3_todos_text'') | default(''Keine'', true)
        }}'
  - action: conversation.process
    data:
      text: 'Erstelle ein deutsches Morgenbriefing mit zeitgerechter Begrüßung (max
        4 Sätze).

        KONTEXT: - Aktuelle Uhrzeit: {{ current_hour }}:00 Uhr - Heutiges Datum: {{
        current_date }} - Wetter: {{ weather_info }}

        TERMINE (nur Event-Namen und Zeiten, KEINE Adressen): - Allgemein: {{ calendar_allgemein
        }} - Uni: {{ calendar_uni }} - KSJ: {{ calendar_ksj }}

        MÜLL: {% if trash_info != "Keine" %}{{ trash_info }} rausbringen{% else %}Keine{%
        endif %}

        TOP 3 TODOS: {{ top_3_todos }}

        GREETING REGELN: - Vor 12 Uhr: "Guten Morgen" - 12-17 Uhr: "Guten Tag" - Nach
        17 Uhr: "Guten Abend"

        REGELN: 1. Starte mit: "<Greeting>, Philipp! Heute ist der {{ current_date
        }}." 2. Nenne nur Event-Namen und Zeiten, KEINE Adressen oder Ort-Details
        3. Ignoriere alle "Keine" Einträge, sprich sie nicht 4. Wetter mit aktueller
        Temperatur nennen 5. Müll-Info nur wenn nicht "Keine" 6. Nenne die top 3 Todos

        Beispiel: "Guten Morgen, Philipp! Heute ist der Donnerstag, 8. Mai. Du hast
        um 10 Uhr Meeting mit Jan und um 14 Uhr Uni-Vorlesung. Das Wetter wird 18
        Grad und bewölkt. Denk daran Bioabfall und Papier rauszubringen."

        '
      agent_id: conversation.claude_conversation_2
    response_variable: briefing
  - action: tts.speak
    target:
      entity_id:
      - tts.openai_tts
    data:
      message: '{{ briefing.response.speech.plain.speech }}'
      media_player_entity_id: media_player.sonos
  mode: single
