  mode: single
- id: webhook_sofa_mitte_turkis_blinken
  alias: 'Webhook: Sofa mitte türkis blinken'
  description: Lässt Sofa mitte beim Webhook-Aufruf drei Mal türkis blinken
  triggers:
  - webhook_id: sofa-mitte-turkis-blinken
    allowed_methods:
    - POST
    - GET
    local_only: false
    trigger: webhook
  conditions: []
  actions:
  - action: notify.mobile_app_iphone_von_philipp
    data:
      title: Ticket verkauft
      message: Ein Ticket wurde verkauft!
  - action: scene.create
    data:
      scene_id: sofa_mitte_vor_blinken
      snapshot_entities:
      - light.kajplats_gu10_cws_470lm_3
    enabled: false
  - repeat:
      count: 3
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.kajplats_gu10_cws_470lm_3
        data:
          hs_color:
          - 180
          - 100
          brightness: 255
      - delay:
          milliseconds: 500
      - action: light.turn_off
        target:
          entity_id: light.kajplats_gu10_cws_470lm_3
      - delay:
          milliseconds: 500
    enabled: false
  - action: scene.turn_on
    target:
      entity_id: scene.sofa_mitte_vor_blinken
    enabled: false
  mode: single
- id: waschmaschine_gestartet
  alias: 'Waschmaschine: Gestartet'
  description: Erkennt automatisch den Start der Waschmaschine via Stromverbrauch
  triggers:
  - trigger: numeric_state
    entity_id: sensor.grillplats_plug_leistung
    above: 2
    for:
      minutes: 1
  conditions:
  - condition: state
    entity_id: input_boolean.waschmaschine_lauft
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.waschmaschine_lauft
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.waschmaschine_abgeholt
  - action: notify.notify
    data:
      title: Waschmaschine gestartet
      message: Die Waschmaschine wurde gestartet.
  mode: single
- id: waschmaschine_fertig_strom
  alias: 'Waschmaschine: Fertig'
  description: Erkennt automatisch das Ende des Waschvorgangs via Stromverbrauch
  triggers:
  - trigger: numeric_state
    entity_id: sensor.grillplats_plug_leistung
    below: 2
    for:
      minutes: 3
  conditions:
  - condition: state
    entity_id: input_boolean.waschmaschine_lauft
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.waschmaschine_lauft
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.waschmaschine_abgeholt
  - action: tts.speak
    target:
      entity_id: tts.google_ubersetzer_en_com_google_translate_en_com
    data:
      media_player_entity_id: media_player.sonos
      message: Die Wäsche ist fertig. Bitte entnehmen.
      language: de
  - action: notify.notify
    data:
      title: Waschmaschine fertig
      message: Die Wäsche ist fertig. Bitte entnehmen.
  - action: timer.start
    target:
      entity_id: timer.waschmaschine_erinnerung
  mode: single
- id: waschmaschine_laufzeit_reset
  alias: 'Waschmaschine: Laufzeit zurücksetzen'
  triggers:
  - trigger: state
    entity_id: input_boolean.waschmaschine_lauft
    to: 'on'
  actions:
