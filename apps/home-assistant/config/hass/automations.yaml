    entity_id: binary_sensor.myggbett_door_window_sensor_tur_3
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.waschmaschine_abgeholt
    state: 'off'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.waschmaschine_quittieren
  mode: single
  mode: single
