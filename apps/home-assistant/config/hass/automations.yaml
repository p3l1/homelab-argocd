- id: waschmaschine_entnommen_sensor
  alias: 'Waschmaschine: Wäsche entnommen (Schubladensensor)'
  description: Erkennt automatisch die Entnahme der Wäsche über den Schubladensensor.
    Sensor ist invertiert - technisch geschlossen (off) bedeutet Schublade physisch
    offen.
  triggers:
