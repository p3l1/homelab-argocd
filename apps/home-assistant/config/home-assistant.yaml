---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      # .storage, custom_components (65 MB ueber HACS) und deps. Die
      # Historie liegt in Postgres, nicht mehr hier.
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  # Recreate, nicht RollingUpdate: Das Volume ist ReadWriteOnce, und zwei
  # laufende Instanzen wuerden sich um Bluetooth und die HomeKit-Ports
  # streiten.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # Ohne hostNetwork keine HomeKit-Bridge, kein Sonos, kein Apple TV
      # und kein Thread: Die vier finden ihre Gegenstellen ueber mDNS und
      # SSDP, und beides bleibt im Pod-Netz stecken.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Fest auf den Node mit dem Bluetooth-Adapter. Das Label statt des
      # Hostnamens, damit die Zuordnung umziehen kann.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.p3l1.de/workload
                    operator: In
                    values: ["home"]
      initContainers:
        # configuration.yaml wird kopiert statt verlinkt, damit !include
        # relativ zu /config aufloest. Die drei UI-Dateien muessen
        # existieren, sonst scheitert ihr !include beim ersten Start.
        - name: prepare-config
          image: docker.io/library/busybox:1.37.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /iac/configuration.yaml /config/configuration.yaml
              mkdir -p /config/themes
              [ -e /config/automations.yaml ] || echo "[]" > /config/automations.yaml
              [ -e /config/scenes.yaml ]     || echo "[]" > /config/scenes.yaml
              [ -e /config/scripts.yaml ]    || echo "{}" > /config/scripts.yaml
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: iac, mountPath: /iac, readOnly: true }
      containers:
        - name: home-assistant
          # Auf die Version des Backups festgenagelt. Ein Backup laesst
          # sich in eine neuere Instanz einlesen, nicht in eine aeltere -
          # erst nach dem Umzug wird aktualisiert.
          image: ghcr.io/home-assistant/home-assistant:2026.8.3
          env:
            - name: TZ
              value: Europe/Berlin
            - name: HA_DB_URL
              valueFrom:
                secretKeyRef:
                  name: home-assistant-db-app
                  key: uri
          ports:
            - containerPort: 8123
              name: http
          securityContext:
            # Bluetooth laeuft ueber BlueZ auf dem Host; HA spricht den
            # System-Bus an und braucht dafuer die Rohsocket-Rechte.
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: iac, mountPath: /config/iac, readOnly: true }
            - { name: secrets, mountPath: /config/secrets.yaml, subPath: secrets.yaml, readOnly: true }
            - { name: dbus, mountPath: /run/dbus, readOnly: true }
          # Grosszuegig: Der erste Start nach dem Einspielen laedt die
          # Abhaengigkeiten der vier Custom Components nach.
          startupProbe:
            httpGet: { path: /manifest.json, port: 8123 }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /manifest.json, port: 8123 }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 3Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: iac
          configMap:
            name: home-assistant-iac
        - name: secrets
          secret:
            secretName: home-assistant-secrets
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector:
    app: home-assistant
  ports:
    - port: 8123
      targetPort: 8123
      name: http
