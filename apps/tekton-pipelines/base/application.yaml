# Tekton Pipelines. Loest Woodpecker als CI ab.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-pipelines
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  project: apps
  sources:
    - chart: tekton-pipeline
      repoURL: https://cdfoundation.github.io/tekton-helm-chart
      targetRevision: 1.14.0
  # Tektons Webhook traegt zur Laufzeit caBundle und Konversionsdaten in die
  # CRDs ein. Das weicht zwangslaeufig vom Repo ab und ist kein Driftfehler.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
        - .spec.preserveUnknownFields
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
