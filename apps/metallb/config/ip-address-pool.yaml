# Adressbereich im LAN 10.35.99.0/24. Die Nodes belegen .210 (API-VIP) bis
# .218, der Pool beginnt daher erst bei .230.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.35.99.230-10.35.99.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool
