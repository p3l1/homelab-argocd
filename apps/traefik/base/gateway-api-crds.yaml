# Alleiniger Eigentuemer dieser CRDs - der Traefik-Chart liefert sie seit v41
# nicht mehr mit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Die HTTPRoute-CRD sprengt bei client-side apply das 256-KiB-Limit der
      # last-applied-configuration-Annotation.
      - ServerSideApply=true
  project: infrastructure
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.5.1
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: default
