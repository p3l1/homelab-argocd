# Traegt DNS-Eintraege im UniFi-Router nach, sobald ein Gateway oder eine
# HTTPRoute einen Hostnamen bekommt. Der Router beherrscht die Network
# Integration API - der Endpunkt /proxy/network/integration/v1 antwortet mit
# 401 statt 404, existiert also und verlangt nur einen Schluessel.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: infrastructure
  sources:
    - chart: external-dns
      repoURL: https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.21.1
      helm:
        valuesObject:
          provider:
            name: webhook
            webhook:
              image:
                repository: ghcr.io/kashalls/external-dns-unifi-webhook
                tag: v0.10.12
              env:
                - name: UNIFI_HOST
                  valueFrom:
                    secretKeyRef:
                      name: unifi-credentials
                      key: UNIFI_HOST
                - name: UNIFI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unifi-credentials
                      key: UNIFI_API_KEY
                # Der Router traegt ein selbstsigniertes Zertifikat.
                - name: UNIFI_SKIP_TLS_VERIFY
                  value: "true"
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http-webhook
                initialDelaySeconds: 10
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: http-webhook
                initialDelaySeconds: 10
          # Nur Gateway-API-Objekte; Services bekommen ihre Adresse von
          # MetalLB und brauchen keinen Namen.
          sources:
            - gateway-httproute
          policy: sync
          registry: txt
          txtOwnerId: homelab
          domainFilters:
            - homelab.internal
          extraArgs:
            - --ignore-ingress-tls-spec
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
