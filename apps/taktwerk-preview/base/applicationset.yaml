# Eine Taktwerk-Instanz je Pull Request mit dem Label "preview".
#
# Chart und Images kommen aus ghcr, beide mit dem Commit der PR im Namen:
# jeder Push erzeugt damit eine neue Spezifikation und loest den Redeploy aus,
# ohne dass ein veraenderliches Tag verfolgt werden muesste.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taktwerk-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: p3l1
          repo: taktwerk
          # Nur PRs, die alle genannten Labels tragen.
          labels:
            - preview
          appSecretName: taktwerk-github-app
        # Kein Webhook: der ApplicationSet-Controller hoert auf einem eigenen
        # Dienst, nicht auf argocd-server, und braeuchte eine eigene Route.
        requeueAfterSeconds: 120
  template:
    metadata:
      name: taktwerk-pr-{{ .number }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        # Woraus die Benachrichtigung ihren Kommentar baut. Die Quelle der
        # Application zeigt auf ghcr, nicht auf GitHub - der github-Dienst
        # findet die PR sonst nicht.
        taktwerk.p3l1.de/repo-url: https://github.com/p3l1/taktwerk
        taktwerk.p3l1.de/revision: "{{ .head_sha }}"
        taktwerk.p3l1.de/preview-url: https://pr-{{ .number }}.taktwerk.cloud.p3l1.de
        taktwerk.p3l1.de/mailpit-url: https://pr-{{ .number }}-mailpit.taktwerk.cloud.p3l1.de
        notifications.argoproj.io/subscribe.on-deployed.github: ""
        notifications.argoproj.io/subscribe.on-health-degraded.github: ""
    spec:
      project: apps
      source:
        repoURL: ghcr.io/p3l1/charts
        chart: taktwerk
        targetRevision: 0.0.0-pr{{ .number }}.{{ .head_short_sha_7 }}
        helm:
          valuesObject:
            host: pr-{{ .number }}.taktwerk.cloud.p3l1.de
            image:
              tag: pr-{{ .number }}-{{ .head_short_sha_7 }}
              pullSecrets:
                - name: ghcr-pull
            existingSecret: taktwerk-preview-secrets
            namespace:
              create: true
              labels:
                p3l1.de/preview-secrets: "true"
            database:
              mode: cnpg
              cnpg:
                instances: 1
                storage: 1Gi
            # Nur wenn ausdruecklich verlangt: ein Postfach braucht, wer Mails
            # pruefen will, und das ist der seltenere Fall. Das Label dafuer
            # heisst mailpit.
            mailpit:
              # In Anfuehrungszeichen, weil ein Wert, der mit {{ beginnt, sonst
              # als YAML-Mapping gelesen wird. Das Chart nimmt die Zeichenkette
              # entgegen und wertet sie aus - Helm allein haelt "false" fuer wahr.
              enabled: '{{ if has "mailpit" .labels }}true{{ else }}false{{ end }}'
              host: pr-{{ .number }}-mailpit.taktwerk.cloud.p3l1.de
            seed:
              enabled: true
              # Muss die Adresse sein, fuer die Pocket ID buergt - sonst landet die
              # Anmeldung auf einem frisch angelegten Benutzer ohne Rechte statt auf
              # dem vorangelegten Superuser.
              adminEmail: philipp@herzo.gs
            # Entra buergt nur fuer den Tenant des Chors; die Konten dieses
            # Homelabs liegen in Pocket ID. Registriert wird nichts: die Instanz
            # weist sich mit einem Dokument unter ihrer eigenen Adresse aus, das
            # Pocket ID beim ersten Anmelden holt. Erlaubt ist das ueber einen
            # Platzhalter in Pocket IDs Einstellungen:
            #   https://*.taktwerk.cloud.p3l1.de/oidc-client.json
            # Bleibt an, obwohl Pocket ID konfiguriert ist: die Testlaeufe
            # melden sich als die vorangelegten Mitglieder an, und die haben
            # nur ein Passwort. Tragbar ist das, weil die Passwoerter aus dem
            # zentralen Secret kommen statt aus dem Quelltext - sonst waere
            # jede offene Instanz mit einem bekannten Wort zu betreten.
            passwordLogin:
              enabled: true
            # Entscheidet mehr als die Fehlermeldungen: eine Instanz, die sich
            # "preview" nennt, zeigt ihre Seed-Zugangsdaten auf der
            # Anmeldeseite. Erreichbar ist der Pfad nur mit Pangolin-Anmeldung,
            # siehe die Regeln unten. Unbelegt hiesse "production", und dann
            # zeigt sie nichts.
            sentry:
              # Eigene Instanz, eigene Umgebung: so stehen die Fehler einer
              # Preview unter ihrer Nummer und nicht im Topf mit Produktion.
              environment: preview-{{ .number }}
              # Moderne DSN ohne Passwortteil - die Anwendung reicht sie
              # ohnehin an jeden Browser weiter, der die Instanz oeffnet.
              dsn: https://6767bb3ce02a4f39a077eb1161ba542d@errors.cloud.p3l1.de/1
            oidc:
              enabled: true
              issuer: https://id.cloud.p3l1.de
              providerId: pocket-id
              providerName: Pocket ID
            route:
              parentRefs:
                - name: pangolin
                  namespace: pangolin-gateway
              annotations:
                pangolin.p3l1.de/display-name: Taktwerk PR #{{ .number }}
                # SSO an, aber fuer alles ausser einem Pfad uebersprungen: die
                # Instanz steht offen, nur die Seed-Zugangsdaten nicht. Erste
                # Uebereinstimmung gewinnt, also steht die Ausnahme vorn.
                #
                # "pass" oeffnet nichts - es faellt auf die Anmeldung zurueck,
                # genau wie eine Anfrage, auf die keine Regel passt.
                pangolin.p3l1.de/sso: "true"
                pangolin.p3l1.de/access-rules: |
                  - action: pass
                    match: path
                    value: /api/preview/credentials
                  - action: allow
                    match: path
                    value: /**
                pangolin.p3l1.de/healthcheck-path: /api/version
            networkPolicy:
              enabled: true
              allowFromNamespaces:
                - newt
      destination:
        server: https://kubernetes.default.svc
        namespace: taktwerk-pr-{{ .number }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Faengt das Fenster ab, in dem das Label schon steht, die CI aber
        # Chart und Images noch nicht gepusht hat.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
