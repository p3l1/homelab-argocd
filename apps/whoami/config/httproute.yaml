---
# Erreichbar unter https://whoami.homelab.internal. Den DNS-Eintrag legt
# external-dns im Router an, das Zertifikat kommt vom Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - whoami.homelab.internal
  rules:
    - backendRefs:
        - name: whoami
          port: 80
