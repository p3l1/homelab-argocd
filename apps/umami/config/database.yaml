# CloudNativePG legt Cluster und Zugangsdaten an; das Secret umami-db-app
# entsteht dabei automatisch und enthaelt unter anderem 'uri'.
#
# Eine Instanz: die Daten sind ersetzbar, Longhorn haelt die Repliken.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: umami-db
  namespace: umami
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: umami
      owner: umami
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
