# Veröffentlicht Umami nach außen, über pangolin-gateway statt über den
# handgeschriebenen Eintrag in pangolin/blueprints/homelab.yaml.
#
# Ohne SSO: Umami sammelt Zugriffe fremder Seiten ein, das Zählskript muss
# ohne Anmeldung erreichbar sein.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami-pangolin
  namespace: umami
  annotations:
    pangolin.p3l1.de/display-name: Umami
    pangolin.p3l1.de/healthcheck-path: /api/heartbeat
    pangolin.p3l1.de/healthcheck-interval: "30"
    pangolin.p3l1.de/healthcheck-timeout: "5"
    pangolin.p3l1.de/sso: "false"
spec:
  parentRefs:
    - name: pangolin
      namespace: pangolin-gateway
  hostnames:
    - umami.cloud.p3l1.de
  rules:
    - backendRefs:
        - name: umami
          port: 3000
