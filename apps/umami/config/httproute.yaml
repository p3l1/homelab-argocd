---
# Erreichbar unter https://umami.homelab.internal. Den DNS-Eintrag legt
# external-dns im Router an, das Zertifikat kommt vom Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami
  namespace: umami
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - umami.homelab.internal
  rules:
    - backendRefs:
        - name: umami
          port: 3000
