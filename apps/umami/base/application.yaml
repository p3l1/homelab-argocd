# Web-Analyse. Die Datenbank stellt CloudNativePG bereit, nicht der
# mitgelieferte PostgreSQL-Subchart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umami
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: apps
  sources:
    # Kustomize statt Helm direkt: nur so laesst sich der 2FA-Schluessel als
    # secretKeyRef nachruesten. Die Chart-Werte stehen in der Kustomization.
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/umami/chart
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/umami/config
  destination:
    server: https://kubernetes.default.svc
    namespace: umami
