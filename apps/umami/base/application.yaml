# Web-Analyse. Die Datenbank stellt CloudNativePG bereit, nicht der
# mitgelieferte PostgreSQL-Subchart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umami
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: apps
  sources:
    - chart: umami
      repoURL: https://christianhuth.github.io/helm-charts
      targetRevision: 7.11.5
      helm:
        valuesObject:
          image:
            # Die versionierten Tags des Charts sind nur amd64 gebaut; auf
            # den Pi endet das in "exec format error". Nur -latest bringt
            # ein arm64-Manifest mit.
            tag: postgresql-latest
          postgresql:
            enabled: false
          mysql:
            enabled: false
          database:
            # CloudNativePG legt zum Cluster das Secret umami-db-app an und
            # hinterlegt die fertige Verbindungszeichenfolge unter 'uri'.
            existingSecret: umami-db-app
            databaseUrlKey: uri
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/umami/config
  destination:
    server: https://kubernetes.default.svc
    namespace: umami
