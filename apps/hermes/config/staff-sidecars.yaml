            - name: HERMES_HOME
              value: /opt/data/profiles/taktwerk
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8645"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-staff-secrets
                  key: API_KEY_TAKTWERK
            - name: CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND
              value: /opt/data/home/.npm-global/bin/claude
            - name: CLAUDE_CONFIG_DIR
              value: /opt/data/home/.claude
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
        # Cluster-Check, Homelab-PRs
