apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: hermes

---
# Die eingebaute Rolle view schliesst Secrets aus und erlaubt pods/log -
# genau der lesende Zugriff, den der Agent haben soll.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
