# Vorlage fuer /opt/data/config.yaml. Ein initContainer legt sie nur an,
# wenn die Datei fehlt - Hermes schreibt die Datei selbst, ein eingehaengtes
# ConfigMap waere schreibgeschuetzt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-seed
  namespace: hermes
data:
  config.yaml: |
    model:
      provider: claude-subscription-directsdk-experimental
      default: sonnet

  # Diese Liste gehoert Git: der initContainer schreibt sie bei jedem Start
  # nach /opt/data/config.yaml, den Rest der Datei fuehrt Hermes selbst.
  mcp-servers.yaml: |
    posteo:
      url: http://imap-posteo:3000/mcp

  # Fuehrt die Serverliste in die Datei ein, die Hermes selbst fortschreibt.
  # Ein Seed allein greift nur auf einem frischen Volume.
  merge-mcp.py: |
    import pathlib
    import yaml

    config = pathlib.Path("/opt/data/config.yaml")
    have = yaml.safe_load(config.read_text()) or {}
    want = yaml.safe_load(pathlib.Path("/seed/mcp-servers.yaml").read_text()) or {}

    if have.get("mcp_servers") != want:
        have["mcp_servers"] = want
        config.write_text(yaml.safe_dump(have, sort_keys=False, allow_unicode=True))
        print("mcp_servers aus dem Seed uebernommen")

  # Legt kubectl fuer den Cluster-Check aufs Volume (nur Lesezugriff ueber den
  # ServiceAccount). Fehlt im Image. Version = Cluster-Version; bei anderer
  # Version wird neu installiert. KUBECTL_VERSION kommt aus dem initContainer.
  install-kubectl.sh: |
    #!/bin/sh
    set -eu
    have=$(/opt/data/bin/kubectl version --client -o json 2>/dev/null |
      grep -o '"gitVersion": "[^"]*' | head -1 | cut -d'"' -f4 || true)
    [ "$have" = "v${KUBECTL_VERSION}" ] && exit 0
    url="https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/arm64/kubectl"
    curl -fsSL -o /tmp/kubectl "$url"
    echo "$(curl -fsSL "$url.sha256")  /tmp/kubectl" | sha256sum -c -
    install -D -m 0755 /tmp/kubectl /opt/data/bin/kubectl

  # Der Helper liest den kurzlebigen Token aus der Datei, die der Sidecar
  # fortschreibt. Diese Datei gehoert Git, nicht Hermes.
  gitconfig: |
    [user]
        name = Hermes
        email = hermes@cloud.p3l1.de
    [credential "https://github.com"]
        helper = "!f() { echo username=x-access-token; echo password=\"$(cat /opt/data/github/token)\"; }; f"
    [init]
        defaultBranch = main
    [push]
        autoSetupRemote = true

  # gh nimmt den Token nur aus der Umgebung, die sich im laufenden Container
  # nicht mehr aendern laesst. Der Wrapper liest ihn bei jedem Aufruf neu und
  # liegt unter dem Namen gh auf dem PATH; das echte Binary steht daneben.
  gh-wrapper: |
    #!/bin/sh
    if [ -r /opt/data/github/token ]; then
        GH_TOKEN=$(cat /opt/data/github/token)
        export GH_TOKEN
    fi
    exec /opt/data/.local/libexec/gh "$@"

  # Holt mit dem Private Key der GitHub App einen Installation-Token und legt
  # ihn auf das geteilte Volume. Nur dieser Container sieht den Key; Hermes
  # sieht allein den Token, und der verfaellt nach einer Stunde.
  github-token.py: |
    import base64
    import json
    import os
    import pathlib
    import subprocess
    import sys
    import time
    import urllib.error
    import urllib.request

    APP_ID = os.environ["GITHUB_APP_ID"]
    # Optional: ohne Angabe sucht das Skript die Installation selbst.
    INSTALLATION_ID = os.environ.get("GITHUB_APP_INSTALLATION_ID") or None
    KEY = pathlib.Path("/tmp/private-key.pem")
    OUT = pathlib.Path("/opt/data/github/token")

    # Ein Token lebt eine Stunde. Der Vorlauf deckt eine gescheiterte Runde ab.
    INTERVAL = 45 * 60
    RETRY = 60


    def log(message):
        print(message, flush=True)


    def b64(raw):
        return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()


    def jwt():
        now = int(time.time())
        # iat leicht in der Vergangenheit, falls die Uhren auseinanderlaufen.
        header = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
        claims = b64(json.dumps({"iat": now - 60, "exp": now + 540, "iss": APP_ID}).encode())
        signed = f"{header}.{claims}".encode()
        signature = subprocess.run(
            ["openssl", "dgst", "-sha256", "-sign", str(KEY)],
            input=signed,
            capture_output=True,
            check=True,
        ).stdout
        return f"{header}.{claims}.{b64(signature)}"


    def call(url, method="GET"):
        request = urllib.request.Request(
            url,
            method=method,
            headers={
                "Authorization": f"Bearer {jwt()}",
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
            },
        )
        with urllib.request.urlopen(request, timeout=30) as response:
            return json.load(response)


    def discover():
        # Genau eine Installation ist der Normalfall. Bei mehreren waere die
        # Wahl geraten, darum dann lieber abbrechen und sie benennen lassen.
        found = call("https://api.github.com/app/installations")
        if len(found) != 1:
            accounts = ", ".join(str(i["account"]["login"]) for i in found)
            raise SystemExit(
                f"{len(found)} Installationen ({accounts}) - "
                "GITHUB_APP_INSTALLATION_ID setzen"
            )
        installation = found[0]
        log(f"Installation {installation['id']} bei {installation['account']['login']}")
        return installation["id"]


    def fetch(installation_id):
        return call(
            f"https://api.github.com/app/installations/{installation_id}/access_tokens",
            method="POST",
        )


    def write(token):
        OUT.parent.mkdir(parents=True, exist_ok=True)
        OUT.parent.chmod(0o700)
        # Erst daneben schreiben, dann umhaengen: ein Leser sieht nie eine
        # halbe Datei und nie eine fehlende.
        tmp = OUT.with_suffix(".new")
        tmp.write_text(token)
        tmp.chmod(0o600)
        tmp.replace(OUT)


    def private_key():
        # Aus der Datei kommt das PEM roh, von Hand eingetragen eher base64.
        raw = os.environ["GITHUB_APP_PRIVATE_KEY"].strip()
        pem = raw.encode() if raw.startswith("-----BEGIN") else base64.b64decode(raw)
        return pem if pem.endswith(b"\n") else pem + b"\n"


    def main():
        KEY.write_bytes(private_key())
        KEY.chmod(0o600)

        installation_id = INSTALLATION_ID or discover()

        while True:
            try:
                granted = fetch(installation_id)
            except urllib.error.HTTPError as error:
                log(f"GitHub wies den Antrag ab: {error.code} {error.read().decode()[:200]}")
                time.sleep(RETRY)
                continue
            except Exception as error:  # Netz weg, DNS weg, Uhr schief
                log(f"Token nicht erneuert: {error}")
                time.sleep(RETRY)
                continue

            write(granted["token"])
            log(f"Token erneuert, gueltig bis {granted.get('expires_at')}")
            time.sleep(INTERVAL)


    if __name__ == "__main__":
        sys.exit(main())
