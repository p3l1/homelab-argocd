# Veroeffentlicht nur das Dashboard. Der API-Server bleibt cluster-intern -
# er kennt allein einen Bearer-Schluessel und keine Anmeldung.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-pangolin
  namespace: hermes
  annotations:
    pangolin.p3l1.de/display-name: Hermes
    # Die Rolle deckt die Anmeldung ueber Pocket ID ab: Pangolin raeumt
    # Benutzer wieder ab, deren username nicht woertlich in der Liste steht,
    # und bei einer IdP-Zeile ist das nicht die E-Mail. Rollen vergleicht es
    # ueber den Namen.
    pangolin.p3l1.de/roles: Member
    pangolin.p3l1.de/users: philipp@herzo.gs
    pangolin.p3l1.de/healthcheck-path: /
    pangolin.p3l1.de/healthcheck-interval: "30"
    pangolin.p3l1.de/healthcheck-timeout: "5"
spec:
  parentRefs:
    - name: pangolin
      namespace: pangolin-gateway
  hostnames:
    - hermes.cloud.p3l1.de
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
