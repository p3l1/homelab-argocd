# Ein Server fuer alle M365-Konten: er haelt die Token selbst und injiziert
# einen account-Parameter in jedes Tool, sobald mehr als eines angemeldet ist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-mcp
  namespace: hermes
spec:
  replicas: 1
  # Der Token-Cache liegt auf einem ReadWriteOnce-Volume: erst der alte Pod
  # weg, dann der neue.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: graph-mcp
  template:
    metadata:
      labels:
        app: graph-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # node:alpine fuehrt das Image als USER node, also UID 1000.
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: graph-mcp
          image: ghcr.io/softeria/ms-365-mcp-server:0.158.0
          # Der Entrypoint ist ms-365-mcp-server, darum nur args.
          args:
            # Ohne -v haengt der Logger nur Dateien an und stdout bleibt
            # leer - kubectl logs zeigte dann nichts.
            - -v
            - --http
            - "3000"
            # Nimmt den OAuth-Zwang vom MCP-Endpunkt: im HTTP-Modus verlangt
            # der Server sonst einen Bearer-Token, den Hermes nicht hat.
            # Erreichbarkeit ist die Authentisierung, siehe NetworkPolicy.
            - --trust-proxy-auth
            # Ohne dieses Flag bleiben Arbeits- und Schulkonten unerreichbar.
            - --org-mode
            # Das Image bringt 334 Tools mit; hier bleiben 31 uebrig.
            # Draussen mit Absicht: send-mail und delete-mail-message,
            # delete-calendar-event, Teilnehmer, sowie find-meeting-times,
            # das Calendars.Read.Shared verlangt. Teams nur lesend: kein
            # send-*/reply-to-*/update-*/create-*/delete-*, keine Reaktionen,
            # keine Mitgliederverwaltung.
            - --enabled-tools
            - ^(list-calendars|list-calendar-events|get-calendar-event|get-calendar-view|create-calendar-event|update-calendar-event|get-schedule|list-mail-folders|list-mail-messages|list-mail-folder-messages|get-mail-message|list-mail-attachments|create-draft-email|create-reply-draft|create-reply-all-draft|move-mail-message|update-mail-message|list-chats|get-chat|list-chat-members|list-chat-messages|get-chat-message|list-chat-message-replies|list-joined-teams|get-team|list-team-channels|get-team-channel|list-channel-messages|get-channel-message|list-channel-message-replies|list-pinned-chat-messages)$
            # Grenze auch fuer den Login: MSAL fragt nur noch diese an.
            # Ohne Mail.Send schaltet der Server send-mail selbst ab, auch
            # wenn es jemand in die Liste oben eintraegt. User.Read nutzt
            # kein Tool, aber testLogin() ruft damit /me ab.
            - --allowed-scopes
            # Chat.Read: Graph verlangt es fuer list-chat-messages und
            # get-chat-message (403 mit nur ChatMessage.Read). Von den
            # gebuendelten Tools fordert nur list-pinned-chat-messages es an,
            # darum steht das harmlose Lese-Tool in der Liste oben: sonst
            # nimmt MSAL den Scope nicht in den Login auf.
            # Teams: nur Lese-Scopes. ChannelMessage.Read.All verlangt
            # Admin-Consent, die uebrigen meist nicht.
            - User.Read Calendars.ReadWrite Mail.ReadWrite Chat.ReadBasic Chat.Read ChatMember.Read ChatMessage.Read Team.ReadBasic.All Channel.ReadBasic.All ChannelMessage.Read.All
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: TZ
              value: Europe/Berlin
            # Arbeitskonten. Ueber 'common' ausgegebene Refresh Token weist
            # Microsoft seit Juni 2026 bei der ersten Erneuerung ab.
            - name: MS365_MCP_TENANT_ID
              value: organizations
            # Token-Cache und Schluesseldatei aufs Volume. Ein OS-Keyring ist
            # hier nie erreichbar: keytar kommt ohne musl-Prebuild ins Image.
            - name: XDG_CONFIG_HOME
              value: /opt/tokens
            # Der Logger folgt nicht XDG_CONFIG_HOME, sondern HOME, und das
            # ist hier schreibgeschuetzt. Die Dateien wachsen unbegrenzt,
            # darum das fluechtige Volume und nicht das Token-PVC.
            - name: MS365_MCP_LOG_DIR
              value: /tmp/logs
            # Kein Proxy davor, also die Adresse der Gegenseite direkt nehmen.
            - name: MS365_MCP_TRUST_PROXY_HOPS
              value: "0"
          volumeMounts:
            - name: tokens
              mountPath: /opt/tokens
            - name: tmp
              mountPath: /tmp
          # Ein /healthz ist nicht dokumentiert, darum der Port selbst. Ein
          # abgelaufenes Konto darf den Pod ohnehin nicht abraeumen.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tokens
          persistentVolumeClaim:
            claimName: graph-mcp-tokens
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: graph-mcp
  namespace: hermes
spec:
  selector:
    app: graph-mcp
  ports:
    - port: 3000
      targetPort: http
      name: http

---
# Die Anmeldung je Konto lebt allein hier. Ist das Volume weg, ist jedes
# Konto neu anzumelden.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graph-mcp-tokens
  namespace: hermes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Mi
