# Veröffentlicht den PaC-Controller nach außen, über pangolin-gateway statt
# über den handgeschriebenen Eintrag in pangolin/blueprints/homelab.yaml.
#
# Ohne SSO: GitHub stellt die Events unbeaufsichtigt zu. Der Controller prüft
# stattdessen die HMAC-Signatur, mit der GitHub jeden Aufruf unterschreibt.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pac-pangolin
  namespace: pipelines-as-code
  annotations:
    pangolin.p3l1.de/display-name: Pipelines-as-Code
    pangolin.p3l1.de/healthcheck-path: /
    pangolin.p3l1.de/healthcheck-interval: "30"
    pangolin.p3l1.de/healthcheck-timeout: "5"
    pangolin.p3l1.de/sso: "false"
spec:
  parentRefs:
    - name: pangolin
      namespace: pangolin-gateway
  hostnames:
    - pac.cloud.p3l1.de
  rules:
    - backendRefs:
        - name: pipelines-as-code-controller
          port: 8080
