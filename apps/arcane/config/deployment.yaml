apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcane
  namespace: arcane
spec:
  replicas: 1
  strategy:
    # Die Volumes sind ReadWriteOnce, es darf also nur ein Pod gleichzeitig
    # laufen.
    type: Recreate
  selector:
    matchLabels:
      app: arcane
  template:
    metadata:
      labels:
        app: arcane
    spec:
      containers:
        - name: arcane
          image: ghcr.io/getarcaneapp/manager:v2.10.2
          ports:
            - containerPort: 3552
              name: http
          env:
            - name: TZ
              value: Europe/Berlin
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: arcane-secrets
                  key: encryption-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: arcane-secrets
                  key: jwt-secret
            # Rueckfall fuer die Redirect-URI, wenn die Anfrage keinen Origin
            # mitbringt. Ohne das bleibt die Vorgabe localhost:3552.
            - name: APP_URL
              value: https://arcane.cloud.p3l1.de
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: https://id.cloud.p3l1.de
            - name: OIDC_CLIENT_ID
              value: 75bff70e-161f-4b53-9c15-c4d41b02fcb2
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: arcane-secrets
                  key: oidc-client-secret
            # groups kommt zur Vorgabe dazu, OIDC_GROUPS_CLAIM steht schon
            # richtig auf "groups".
            - name: OIDC_SCOPES
              value: openid email profile groups
            - name: OIDC_PROVIDER_NAME
              value: Pocket ID
            # Statischer Admin-API-Key. Arcane legt ihn beim Start an und
            # rotiert ihn, sobald sich der Wert hier unterscheidet.
            - name: ADMIN_STATIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arcane-secrets
                  key: admin-static-api-key
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: backups
              mountPath: /app/backups
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arcane-data
        - name: backups
          persistentVolumeClaim:
            claimName: arcane-backups
---
apiVersion: v1
kind: Service
metadata:
  name: arcane
  namespace: arcane
spec:
  selector:
    app: arcane
  ports:
    - port: 3552
      targetPort: http
      name: http
