apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcane
  namespace: arcane
spec:
  replicas: 1
  strategy:
    # Die Volumes sind ReadWriteOnce, es darf also nur ein Pod gleichzeitig
    # laufen.
    type: Recreate
  selector:
    matchLabels:
      app: arcane
  template:
    metadata:
      labels:
        app: arcane
    spec:
      containers:
        - name: arcane
          image: ghcr.io/getarcaneapp/manager:v2.10.2
          ports:
            - containerPort: 3552
              name: http
          env:
            - name: TZ
              value: Europe/Berlin
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: arcane-secrets
                  key: encryption-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: arcane-secrets
                  key: jwt-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: backups
              mountPath: /app/backups
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arcane-data
        - name: backups
          persistentVolumeClaim:
            claimName: arcane-backups
---
apiVersion: v1
kind: Service
metadata:
  name: arcane
  namespace: arcane
spec:
  selector:
    app: arcane
  ports:
    - port: 3552
      targetPort: http
      name: http
