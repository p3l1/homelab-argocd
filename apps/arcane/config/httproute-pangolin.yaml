# Veröffentlicht Arcane nach außen, über pangolin-gateway statt über den
# handgeschriebenen Eintrag in pangolin/blueprints/homelab.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arcane-pangolin
  namespace: arcane
  annotations:
    pangolin.p3l1.de/display-name: Arcane
    pangolin.p3l1.de/healthcheck-path: /
    pangolin.p3l1.de/healthcheck-interval: "30"
    pangolin.p3l1.de/healthcheck-timeout: "5"
spec:
  parentRefs:
    - name: pangolin
      namespace: pangolin-gateway
  hostnames:
    - arcane.cloud.p3l1.de
  rules:
    - backendRefs:
        - name: arcane
          port: 3552
