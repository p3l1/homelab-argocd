---
# Woechentlich montags um 04:00, also nach der naechtlichen Sicherung.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-restore-trigger
  namespace: paperless-restore

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperless-restore-trigger
  namespace: paperless-restore
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperless-restore-trigger
  namespace: paperless-restore
subjects:
  - kind: ServiceAccount
    name: paperless-restore-trigger
    namespace: paperless-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paperless-restore-trigger

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-restore-check
  namespace: paperless-restore
spec:
  schedule: "0 4 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: paperless-restore-trigger
          containers:
            - name: trigger
              # Offizielles Image: Bitnami hat versionierte Tags aus dem
              # oeffentlichen Registry entfernt.
              image: registry.k8s.io/kubectl:v1.33.4
              command:
                - sh
                - -c
                - |
                  set -e
                  cat <<EOF | kubectl create -f -
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: paperless-restore-check-
                    namespace: paperless-restore
                  spec:
                    pipelineRef:
                      name: paperless-restore-check
                    timeouts:
                      pipeline: 2h
                    workspaces:
                      - name: scratch
                        volumeClaimTemplate:
                          spec:
                            accessModes: [ReadWriteOnce]
                            storageClassName: longhorn
                            resources:
                              requests:
                                # ZIP rund 1 GB, entpackt nochmal so viel.
                                storage: 5Gi
                  EOF
                  kubectl get pipelinerun -n paperless-restore \
                    -l tekton.dev/pipeline=paperless-restore-check \
                    --sort-by=.metadata.creationTimestamp -o name \
                    | head -n -8 | xargs -r kubectl delete -n paperless-restore
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
