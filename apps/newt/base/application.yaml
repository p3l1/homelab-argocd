# Newt haelt den Pangolin-Tunnel nach aussen. Die Verbindung baut Newt selbst
# auf, es braucht also keine LoadBalancer-Adresse.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: newt
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: infrastructure
  sources:
    - chart: newt
      repoURL: https://charts.fossorial.io
      targetRevision: 1.5.0
      helm:
        valuesObject:
          newtInstances:
            - name: default
              enabled: true
              auth:
                existingSecretName: newt-credentials
              acceptClients: true
              service:
                type: ClusterIP
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
    - repoURL: https://github.com/p3l1/homelab-argocd.git
      targetRevision: main
      path: apps/newt/config
      directory:
        # Die Dienste liegen unter config/services; ohne recurse liest
        # ArgoCD nur die oberste Ebene und legt sie nicht an.
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: newt
