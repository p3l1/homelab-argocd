apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: preview-secrets
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml

# Der Namenshash rollt das Deployment neu, sobald sich der Code aendert.
configMapGenerator:
  - name: preview-secrets-src
    files:
      - src/sync.py
