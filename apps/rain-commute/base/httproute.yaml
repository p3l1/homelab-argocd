apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rain-commute
  namespace: rain-commute
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - regen.homelab.internal
  rules:
    - matches:
        # Die Bedienseite liegt auf /, damit man nicht radar.svg tippen muss.
        # Die uebrigen Pfade bedienen sie und den Link aus der Gotify-Nachricht.
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rain-commute
          port: 8000
