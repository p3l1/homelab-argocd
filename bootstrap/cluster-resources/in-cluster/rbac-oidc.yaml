# Bindet die beiden Pocket-ID-Gruppen an Cluster-Rollen. Das Praefix oidc:
# stammt aus oidc-groups-prefix des Apiservers.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pocket-id-kubernetes-admins
subjects:
  - kind: Group
    name: oidc:kubernetes_admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# view laesst Secrets aus; wer sie braucht, gehoert in kubernetes_admins.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pocket-id-kubernetes-read-only
subjects:
  - kind: Group
    name: oidc:kubernetes_read_only
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
