apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
- behavior: merge
  literals:
  - |
    repository.credentials=- passwordSecret:
        key: git_token
        name: autopilot-secret
      url: https://github.com/
      usernameSecret:
        key: git_username
        name: autopilot-secret
  name: argocd-cm
- behavior: merge
  literals:
    - server.insecure=true
  name: argocd-cmd-params-cm
kind: Kustomization
namespace: argocd
resources:
- https://github.com/argoproj-labs/argocd-autopilot/manifests/ha
# ingress.yaml und certificate.yaml brauchen die CRDs von Traefik und
# cert-manager. Beim ersten Anwenden gibt es die noch nicht - ArgoCD zieht
# sie nach, sobald die Infrastruktur steht.
- ./ingress.yaml
- ./middleware.yaml
- ./certificate.yaml
