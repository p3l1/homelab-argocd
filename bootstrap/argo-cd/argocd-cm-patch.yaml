# Anmeldung ueber Pocket ID, Client "ArgoCD Homelab".
#
# Kein rootCA: Damit prueft ArgoCD ausschliesslich gegen die eine angegebene
# CA, und der Kettenaufbau ueber das kreuzsignierte ISRG Root YR scheitert
# dort - die Anmeldung gelingt, jede Sitzungspruefung danach nicht.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://argocd.cloud.p3l1.de
  # Kein lokaler Admin mehr: Pocket ID ist der einzige Weg in die
  # Oberflaeche. Zurueck geht es ueber kubectl, indem dieser Wert in der
  # ConfigMap wieder auf true steht.
  admin.enabled: "false"
  oidc.config: |
    name: Pocket-ID
    issuer: https://id.cloud.p3l1.de
    clientID: daa63aba-e4c3-48c9-8ded-300f1da60134
    clientSecret: $argocd-oidc-secret:oidc.clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true
