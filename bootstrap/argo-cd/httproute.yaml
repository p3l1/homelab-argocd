---
# Erreichbar unter https://argocd.homelab.internal. Den DNS-Eintrag legt
# external-dns im Router an, das Zertifikat kommt vom Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - argocd.homelab.internal
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
