# Nimmt GitHubs Pull-Request-Ereignisse entgegen, damit der Generator nicht auf
# seinen naechsten Durchlauf warten muss. Spuerbar beim Abbau: dort ist die
# Wartezeit reines Nichtstun, waehrend sie beim Aufbau ohnehin hinter der CI
# verschwindet.
#
# Eigener Dienst, nicht argocd-server: der ApplicationSet-Controller bringt
# einen eigenen Webhook-Server auf Port 7000 mit.
#
# Die Zugriffsregeln sind der einzige Schutz. Der Controller prueft die
# Signatur nicht, mit der GitHub jeden Aufruf unterschreibt - siehe
# https://github.com/argoproj/argo-cd/issues/21444. Ein Secret an der App
# waere damit wirkungslos, also grenzt stattdessen die Herkunft ein.
#
# Die letzte Regel schliesst alles, was nicht von GitHub kommt; erste
# Uebereinstimmung gewinnt, also stehen die erlaubten Bereiche davor.
#
# SSO bleibt trotzdem an. Es kostet nichts, weil "allow" die Anmeldung fuer
# GitHub ohnehin ueberspringt, und es traegt genau dann, wenn die Regeln nicht
# ankommen - eine Fassung des Controllers, die diese Annotation nicht kennt,
# uebergeht sie ohne Fehler. Ohne SSO stuende der Endpunkt dann offen.
#
# Die Bereiche stehen unter https://api.github.com/meta im Feld "hooks" und
# aendern sich gelegentlich.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-appset-webhook
  namespace: argocd
  annotations:
    pangolin.p3l1.de/display-name: ArgoCD ApplicationSet Webhook
    pangolin.p3l1.de/sso: "true"
    # Pangolin stellt einem Ziel nichts zu, dessen Zustand es nicht kennt -
    # ohne Pruefung antwortet die Adresse mit 404. Der Webhook-Server hat
    # keinen Pfad, der 2xx liefert: /api/webhook gibt auf GET eine 400,
    # alles andere 404.
    #
    # tcp statt healthcheck-status: "400" - beides ginge, aber die 400 ist ein
    # Innenleben von ArgoCD, das ein Upgrade aendern darf. Ein offener Port
    # behauptet weniger und bleibt dabei richtig.
    pangolin.p3l1.de/healthcheck-mode: tcp
    pangolin.p3l1.de/access-rules: |
      - action: allow
        match: cidr
        value: 192.30.252.0/22
      - action: allow
        match: cidr
        value: 185.199.108.0/22
      - action: allow
        match: cidr
        value: 140.82.112.0/20
      - action: allow
        match: cidr
        value: 143.55.64.0/20
      - action: deny
        match: cidr
        value: 0.0.0.0/0
spec:
  parentRefs:
    - name: pangolin
      namespace: pangolin-gateway
  hostnames:
    - argocd-webhook.cloud.p3l1.de
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/webhook
      backendRefs:
        - name: argocd-applicationset-controller
          port: 7000
