---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-certificate
  namespace: argocd
spec:
  secretName: argocd-server-tls
  dnsNames:
    - argocd.p3l1.de
  issuerRef:
    # Cluster-lokale CA aus apps/cert-manager/config/pki.yaml. Fuer ein
    # oeffentlich gueltiges Zertifikat braeuchte es einen ACME-Issuer.
    name: homelab-ca
    kind: ClusterIssuer
