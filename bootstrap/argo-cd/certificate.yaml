---
# Das Gateway terminiert TLS mit der Wildcard aus dem Traefik-Namensraum.
# Diese Bescheinigung dient dem Zugriff auf argocd-server selbst, etwa fuer
# die CLI mit --grpc-web.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-certificate
  namespace: argocd
spec:
  secretName: argocd-server-tls
  dnsNames:
    - argocd.homelab.internal
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
